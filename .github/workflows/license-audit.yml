name: License audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  license-audit:
    name: Bundled-license audit (NFR-6 / DR-11)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run license audit
        run: |
          python3 app/scripts/license_audit.py \
            --report dist-audit/license-report.md

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-audit-report
          path: dist-audit/license-report.md
          if-no-files-found: warn
